<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile | MentorBridge</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body data-page="student-profile">
  <header class="site-header">
    <div class="container navbar">
      <a class="brand" href="../index.html"><img src="../assets/logo-new.jpg" alt="MentorBridge"><span>mentor<span class="brand-accent">bridge</span></span></a>
      <div class="nav-actions"><a class="btn btn-outline" href="student-dashboard.html">Dashboard</a></div>
    </div>
  </header>
  <main class="container" style="padding: 4rem 0;">
    <section class="profile-card">
      <div class="page-title"><div><span class="section-label">Student profile</span><h1>Update your profile</h1></div></div>
      <form class="setting-form">
        <div class="form-group"><label class="form-label" for="profilePhoto">Profile picture</label><input class="form-input" id="profilePhoto" type="file"></div>
        <div class="form-group"><label class="form-label" for="programme">Programme</label><input class="form-input" id="programme" type="text" placeholder="e.g. Computer Science"></div>
        <div class="form-group"><label class="form-label" for="academicLevel">Academic level</label><select class="form-select" id="academicLevel"><option value="">Select your level</option><option value="100">Level 100</option><option value="200">Level 200</option><option value="300">Level 300</option><option value="400">Level 400</option></select></div>
        <div class="form-group"><label class="form-label" for="skills">Skills</label><input class="form-input" id="skills" type="text" placeholder="e.g. JavaScript, Python, React"></div>
        <div class="form-group"><label class="form-label" for="interests">Interests</label><input class="form-input" id="interests" type="text" placeholder="e.g. Software Engineering, AI"></div>
        <div class="form-group"><label class="form-label" for="careerGoals">Career goals</label><input class="form-input" id="careerGoals" type="text" placeholder="e.g. Full-stack Developer"></div>
        <div class="form-group"><label class="form-label" for="resume">Resume upload</label><input class="form-input" id="resume" type="file"></div>
        <div class="form-group"><label class="form-label" for="linkedin">LinkedIn</label><input class="form-input" id="linkedin" type="url" placeholder="https://www.linkedin.com/in/..."></div>
        <button class="btn btn-primary" type="button" id="saveStudentProfileBtn">Save profile</button>
        <div id="studentProfileFeedback" style="margin-top:0.75rem;"></div>
      </form>
    </section>
  </main>
  <footer class="site-footer"><div class="container footer-grid"><div><a class="brand" href="../index.html"><img src="../assets/logo-new.jpg" alt="MentorBridge"><span>mentor<span class="brand-accent">bridge</span></span></a></div></div></footer>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/firebase-auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/chat.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      var session = {};
      try { session = JSON.parse(sessionStorage.getItem('mb_session') || '{}'); } catch(e) {}
      if (!session.uid) { window.location.replace('auth.html'); return; }

      var db = null;
      try {
        await initializeFirebaseConfig();
        db = getFirestore();
        var doc = await db.collection('users').doc(session.uid).get();
        if (doc.exists) {
          var d = doc.data();
          if (d.programme) document.getElementById('programme').value = d.programme;
          if (d.year) document.getElementById('academicLevel').value = String(d.year);
          if (Array.isArray(d.skills)) document.getElementById('skills').value = d.skills.join(', ');
          if (Array.isArray(d.interests)) document.getElementById('interests').value = d.interests.join(', ');
          if (d.goal) document.getElementById('careerGoals').value = d.goal;
          if (d.linkedinUrl) document.getElementById('linkedin').value = d.linkedinUrl;
        }
      } catch (error) {
        console.error('Failed to load real student profile:', error);
      }

      var saveBtn = document.getElementById('saveStudentProfileBtn');
      var fb = document.getElementById('studentProfileFeedback');
      if (saveBtn) {
        saveBtn.addEventListener('click', async function () {
          saveBtn.textContent = 'Saving…'; saveBtn.disabled = true;
          try {
            if (!db) throw new Error('Not connected');
            var skills = document.getElementById('skills').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
            var interests = document.getElementById('interests').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
            await db.collection('users').doc(session.uid).update({
              programme: document.getElementById('programme').value.trim(),
              year: document.getElementById('academicLevel').value,
              skills: skills,
              interests: interests,
              goal: document.getElementById('careerGoals').value.trim(),
              linkedinUrl: document.getElementById('linkedin').value.trim(),
              lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            });
            saveBtn.textContent = 'Save profile'; saveBtn.disabled = false;
            if (fb) { fb.textContent = '✓ Profile saved.'; fb.style.color = '#22A06B'; setTimeout(function(){ fb.textContent=''; }, 3000); }
          } catch (error) {
            console.error('Failed to save student profile:', error);
            saveBtn.textContent = 'Save profile'; saveBtn.disabled = false;
            if (fb) { fb.textContent = 'Could not save — please check your connection and try again.'; fb.style.color = '#DC2626'; }
          }
        });
      }
    });
  </script>
</body>
</html>
