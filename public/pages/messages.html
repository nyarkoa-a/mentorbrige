    .conv-skel-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(90deg,#f0f2f7 25%,#e8eaf0 50%,#f0f2f7 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; flex-shrink: 0; }

    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── Responsive ── */

<script>
/* ── Real-time Messaging with Firebase Integration ── */
var activeConvId = null;
var currentRole = 'student';
var currentUserId = null;
var currentUserName = null;
var searchQuery = '';
var conversations = [];
var activeMessageUnsubscribe = null;
var activeListeners = new Map();

/* ── Helpers ── */
var $ = function(id){ return document.getElementById(id); };
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTs(ts){
  var now = Date.now(), d = new Date(ts), diff = now - ts;
  if(diff < 60000) return 'Just now';
  if(diff < 3600000) return Math.floor(diff/60000)+' min ago';
  var today = new Date(); var yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
  if(d.toDateString()===today.toDateString()) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function fmtDateDivider(ts){
  var d = new Date(ts), today = new Date(), yesterday = new Date(today);
  yesterday.setDate(today.getDate()-1);
  if(d.toDateString()===today.toDateString()) return 'Today';
  if(d.toDateString()===yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
}
function getConvs(){ return conversations; }
function getTotalUnread(){ return conversations.reduce(function(s,c){return s+(c.unreadCount||0);},0); }
function initials(name){ return name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
function avatarHtml(photo, name, cls){
  cls = cls||'conv-avatar';
  if(photo) return '<img class="'+cls+'" src="'+esc(photo)+'" alt="'+esc(name)+'" />';
  return '<div class="'+cls+'-initials">'+initials(name)+'</div>';
}

/* ── Firebase Messaging Integration ── */
// Converts a real conversation document (participants[]/participantDetails{}/
// unreadCounts{}) into the legacy per-other-participant shape this page's
// existing render code expects.
function toLegacyConversation(conv) {
  var otherUid = (conv.participants || []).find(function(p){ return p !== currentUserId; }) || null;
  var details = (conv.participantDetails && otherUid && conv.participantDetails[otherUid]) || {};
  var roleLabel = details.role === 'mentor' ? 'Mentor' : details.role === 'admin' ? 'Admin' : 'Mentee';
  var lastAt = conv.lastMessageAt instanceof Date ? conv.lastMessageAt.getTime() : Date.now();
  // A single synthetic message so the conversation list can show a real preview
  // and timestamp without needing every conversation opened first; openConv()
  // replaces this with the real, full message history via the live listener.
  var previewMessages = conv.lastMessage ? [{
    id: 'preview', senderId: conv.lastMessage.senderId, text: conv.lastMessage.text, ts: lastAt, status: 'sent'
  }] : [];
  return {
    id: conv.id,
    participantId: otherUid,
    participantName: details.name || 'User',
    participantPhoto: details.profilePhoto || null,
    participantRole: roleLabel,
    unreadCount: (conv.unreadCounts && conv.unreadCounts[currentUserId]) || 0,
    lastMessageAt: lastAt,
    messages: previewMessages
  };
}

async function loadConversations() {
  try {
    if (!window.mentorBridgeMessaging || !window.mentorBridgeMessaging.isInitialized()) {
      console.warn('Messaging service not initialized');
      conversations = [];
      renderConvList();
      return;
    }

    const userConversations = await window.mentorBridgeMessaging.getConversations();
    conversations = userConversations.map(toLegacyConversation);
    renderConvList();

    // If a specific mentor was passed in via ?to=, open (or start) that conversation now
    maybeStartConversationFromUrl();

  } catch (error) {
    console.error('Error loading conversations:', error);
    conversations = [];
    renderConvList();
  }
}

// Supports being linked here as messages.html?to=<userId> (e.g. from a mentor's
// profile or a dashboard's "Message" button) by finding or creating a real
// conversation with that person, rather than requiring one to already exist.
async function maybeStartConversationFromUrl() {
  var urlParams = new URLSearchParams(window.location.search);
  var toId = urlParams.get('to');
  if (!toId) return;

  var existing = conversations.find(function(c){ return c.participantId === toId; });
  if (existing) { openConv(existing.id); return; }

  try {
    if (!window.mentorBridgeMessaging || !window.mentorBridgeMessaging.isInitialized()) return;
    var conv = await window.mentorBridgeMessaging.createConversation([toId]);
    var legacy = toLegacyConversation(conv);
    conversations.unshift(legacy);
    renderConvList();
    openConv(legacy.id);
  } catch (error) {
    console.error('Could not start conversation with', toId, error);
  }
}

/* ── Render conversation list ── */
function renderConvList(){
  var convs = getConvs().filter(function(c){
    if(!searchQuery) return true;
    var q = searchQuery.toLowerCase();
    return c.participantName.toLowerCase().includes(q) ||
      (c.messages && c.messages.length && c.messages[c.messages.length-1].text.toLowerCase().includes(q));
  });
  var html = '';
  if(!convs.length){
    html = '<div class="conv-empty"><p>'+(searchQuery?'No results for "'+esc(searchQuery)+'"':'No conversations yet.')+'</p>'
      + (!searchQuery && currentRole==='mentor' ? '<a href="mentor-dashboard.html" class="btn btn-outline btn-sm">View My Mentees →</a>' : '')
      + (!searchQuery && currentRole!=='mentor' ? '<a href="mentor-directory.html" class="btn btn-outline btn-sm">Find a Mentor →</a>' : '')
      + '</div>';
    $('convList').innerHTML = html; return;
  }
  convs.forEach(function(c){
    var lastMsg = c.messages && c.messages.length ? c.messages[c.messages.length-1] : null;
    var preview = lastMsg ? esc(lastMsg.text.slice(0,55)+(lastMsg.text.length>55?'…':'')) : 'No messages yet';
    var time = lastMsg ? fmtTs(lastMsg.ts) : '';
    var unreadCount = c.unreadCount || 0;
    var unreadHtml = unreadCount>0 ? '<span class="conv-unread-badge">'+unreadCount+'</span>' : '';
    var isActive = c.id===activeConvId ? ' active' : '';
    var isUnread = unreadCount>0 ? ' unread' : '';
    html += '<div class="conv-item'+isActive+isUnread+'" data-conv-id="'+c.id+'">'
      + avatarHtml(c.participantPhoto, c.participantName)
      + '<div class="conv-info">'
      + '<div class="conv-name-row"><span class="conv-name">'+esc(c.participantName)+'</span><span class="conv-time">'+time+'</span></div>'
      + '<div class="conv-preview">'+preview+'</div>'
      + '</div>'
      + unreadHtml
      +'</div>';
  });
  $('convList').innerHTML = html;
  $('convList').querySelectorAll('.conv-item').forEach(function(el){
    el.addEventListener('click', function(){ openConv(el.dataset.convId); });
  });
}

/* ── Open conversation ── */
async function openConv(convId){
  var convs = getConvs();
  var conv = convs.find(function(c){return c.id===convId;});
  if(!conv) return;
  activeConvId = convId;
  
  // Mark as read
  conv.unreadCount = 0;
  if (conv.messages) {
    conv.messages.forEach(function(m){ delete m.unread; });
  }

  // Update header
  var ph = conv.participantPhoto;
  var el = $('convAvatarEl');
  if(el){
    if(ph){ el.outerHTML='<img class="chat-header-avatar" id="convAvatarEl" src="'+esc(ph)+'" alt="'+esc(conv.participantName)+'" />'; }
    else { el.className='chat-header-avatar-initials'; el.id='convAvatarEl'; el.textContent=initials(conv.participantName); }
  }
  $('convNameEl').textContent = conv.participantName;
  $('convRoleEl').textContent = conv.participantRole;

  // Show active conv, hide placeholder
  $('chatPlaceholder').style.display='none';
  var ac = $('activeConv'); ac.style.display='flex';

  // Load messages in real time from Firebase if available. listenToMessages keeps
  // a live listener running; we stop any previous one before starting a new one.
  if (activeMessageUnsubscribe) { activeMessageUnsubscribe(); activeMessageUnsubscribe = null; }

  if (window.mentorBridgeMessaging && window.mentorBridgeMessaging.isInitialized()) {
    try {
      activeMessageUnsubscribe = window.mentorBridgeMessaging.listenToMessages(convId, function(realMessages) {
        conv.messages = realMessages.map(function(m) {
          return {
            id: m.id,
            senderId: m.senderId,
            text: m.text,
            ts: m.sentAt instanceof Date ? m.sentAt.getTime() : Date.now(),
            status: 'sent'
          };
        });
        if (activeConvId === convId) { renderMessages(conv); renderConvList(); }
      });
      window.mentorBridgeMessaging.markMessagesAsRead(convId).catch(function(e){ console.error('Could not mark read:', e); });
    } catch (error) {
      console.error('Error loading messages:', error);
    }
  }

  renderMessages(conv);
  renderConvList();

  // Mobile: hide conv list
  var clp = $('convListPanel');
  if(window.innerWidth<=700) clp.classList.add('hidden-mobile');
}

/* ── Render messages ── */
function renderMessages(conv){
  var area = $('chatMessages');
  if(!conv.messages.length){
    area.innerHTML='<div class="msg-conv-empty"><p>Start the conversation with '+esc(conv.participantName)+'.</p></div>';
    return;
  }
  var html='', lastDate='';
  conv.messages.forEach(function(msg){
    var d = fmtDateDivider(msg.ts);
    if(d!==lastDate){ html+='<div class="msg-date-divider">'+d+'</div>'; lastDate=d; }
    var mine = msg.senderId===currentUserId;
    var wrapCls = 'msg-bubble-wrap '+(mine?'mine':'theirs');
    var statusHtml='';
    if(mine){
      if(msg.status==='sending') statusHtml='<span class="msg-status sending">Sending…</span>';
      else if(msg.status==='failed') statusHtml='<span class="msg-status failed">Failed. <button class="msg-retry-btn" data-msg-id="'+msg.id+'">Retry</button></span>';
      else statusHtml='<span class="msg-status sent">✓</span>';
    }
    html+='<div class="'+wrapCls+'" id="msgwrap-'+msg.id+'">'
      +'<div class="msg-bubble">'+esc(msg.text)+'</div>'
      +'<div class="msg-meta '+(mine?'mine':'')+'"><span>'+fmtTs(msg.ts)+'</span>'+statusHtml+'</div>'
      +'</div>';
  });
  area.innerHTML=html;
  area.scrollTop=area.scrollHeight;
  // Bind retry buttons
  area.querySelectorAll('.msg-retry-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ retryMessage(conv, btn.dataset.msgId); });
  });
}

/* ── Send message ── */
async function sendMessage(){
  var input=$('msgInput'), errorEl=$('composerError');
  var text=input.value.trim();
  if(!text){ errorEl.textContent='Please enter a message.'; errorEl.classList.remove('hidden'); return; }
  if(text.length>2000){ errorEl.textContent='Message is too long (max 2000 characters).'; errorEl.classList.remove('hidden'); return; }
  errorEl.classList.add('hidden');
  var convs=getConvs(), conv=convs.find(function(c){return c.id===activeConvId;});
  if(!conv) return;

  var msgId='msg'+Date.now();
  var msg={id:msgId, senderId:currentUserId, text:text, ts:Date.now(), status:'sending'};
  
  // Add to local conversation immediately
  if (!conv.messages) conv.messages = [];
  conv.messages.push(msg);
  input.value=''; input.style.height='42px';
  $('sendBtn').disabled=true;
  renderMessages(conv);

  // Send via Firebase
  if (window.mentorBridgeMessaging && window.mentorBridgeMessaging.isInitialized()) {
    try {
      await window.mentorBridgeMessaging.sendMessage(conv.id, text);
      // The real-time listener set up in openConv() will replace this optimistic
      // local copy with the real saved message within moments.
      msg.status='sent';
      renderMessages(conv);
      renderConvList();
    } catch (error) {
      console.error('Error sending message:', error);
      msg.status='failed';
      renderMessages(conv);
      errorEl.textContent='Failed to send message. Please try again.';
      errorEl.classList.remove('hidden');
    }
  } else {
    msg.status='failed';
    renderMessages(conv);
    errorEl.textContent='Messaging service is unavailable right now. Please check your connection and try again.';
    errorEl.classList.remove('hidden');
  }
}

function retryMessage(conv, msgId){
  var msg=conv.messages.find(function(m){return m.id===msgId;});
  if(!msg) return;
  msg.status='sending';
  renderMessages(conv);
  setTimeout(function(){ msg.status='sent'; renderMessages(conv); renderConvList(); }, 800);
}

/* ── Init ── */
document.addEventListener('DOMContentLoaded', async function(){
  var session={};
  try{ session=JSON.parse(sessionStorage.getItem('mb_session')||'{}'); }catch(e){}
  var role=session.role||'student';
  currentRole=role;
  currentUserId=session.uid;
  currentUserName=session.name||'User';
  var inits=initials(currentUserName);

  if(!session.role){ window.location.replace('auth.html'); return; }

  $('sidebarInitials').textContent=inits;
  $('sidebarName').textContent=currentUserName;
  $('sidebarRole').textContent=role==='mentor'?'Mentor':role==='admin'?'Admin':'Mentee';
  $('headerAvatar').textContent=inits;

  var dashUrl=role==='mentor'?'mentor-dashboard.html':role==='admin'?'../admin/dashboard.html':'student-dashboard.html';
  var menteeLinks=[
    {href:dashUrl,icon:'🏠',label:'Dashboard'},{href:'mentor-profile.html',icon:'👤',label:'My Mentor'},
    {href:'sessions.html',icon:'📅',label:'Sessions'},{href:'goals.html',icon:'🎯',label:'Goals & Progress'},
    {href:'opportunities.html',icon:'💼',label:'Opportunities'},{href:'messages.html',icon:'💬',label:'Messages',active:true},
    {href:'resource-centre.html',icon:'📚',label:'Resources'},{href:'notifications.html',icon:'🔔',label:'Notifications'},
    {href:'settings.html',icon:'⚙️',label:'Settings'}
  ];
  var mentorLinks=[
    {href:dashUrl,icon:'🏠',label:'Dashboard'},{href:'coming-soon.html',icon:'👥',label:'My Mentees'},
    {href:'sessions.html',icon:'📅',label:'Sessions'},{href:'goals.html',icon:'🎯',label:'Goals & Progress'},
    {href:'messages.html',icon:'💬',label:'Messages',active:true},{href:'resource-centre.html',icon:'📚',label:'Resources'},
    {href:'notifications.html',icon:'🔔',label:'Notifications'},{href:'settings.html',icon:'⚙️',label:'Settings'}
  ];
  $('sidebarNav').innerHTML=(role==='mentor'?mentorLinks:menteeLinks).map(function(l){
    return '<a href="'+l.href+'"'+(l.active?' class="active"':'')+'><span class="db-nav-icon">'+l.icon+'</span>'+l.label+'</a>';
  }).join('');

  // Mobile sidebar
  var menuBtn=$('menuBtn'),sidebar=$('dbSidebar'),overlay=$('sidebarOverlay');
  if(menuBtn) menuBtn.addEventListener('click',function(){ sidebar.classList.toggle('open'); overlay.classList.toggle('open'); });
  if(overlay) overlay.addEventListener('click',function(){ sidebar.classList.remove('open'); overlay.classList.remove('open'); });
  (function(){
    var lBtn = document.getElementById('logoutBtn');
    var lModal = document.getElementById('logoutConfirmModal');
    var lConfirm = document.getElementById('logoutConfirmBtn');
    var lCancel = document.getElementById('logoutCancelBtn');
    if(lBtn && lModal){
      lBtn.addEventListener('click', function(){ lModal.style.display='flex'; document.body.style.overflow='hidden'; });
      if(lCancel) lCancel.addEventListener('click', function(){ lModal.style.display='none'; document.body.style.overflow=''; });
      if(lConfirm) lConfirm.addEventListener('click', function(){ sessionStorage.removeItem('mb_session'); window.location.href='auth.html'; });
      lModal.addEventListener('click', function(e){ if(e.target===lModal){ lModal.style.display='none'; document.body.style.overflow=''; } });
    }
  })();

  // Back button (mobile)
  if($('chatBackBtn')) $('chatBackBtn').addEventListener('click',function(){
    $('convListPanel').classList.remove('hidden-mobile');
    activeConvId=null;
    $('chatPlaceholder').style.display='flex';
    $('activeConv').style.display='none';
  });

  // Initialize Firebase + messaging service, then load real conversations.
  // Awaited properly so loadConversations() never runs before the service is ready.
  try {
    await initializeFirebaseConfig();
    if (window.mentorBridgeMessaging) await window.mentorBridgeMessaging.initialize();
  } catch (error) {
    console.error('Failed to initialize Firebase in messages.html:', error);
  }
  loadConversations();

  // Search
  var searchEl=$('convSearch'), deb;
  if(searchEl) searchEl.addEventListener('input',function(){
    clearTimeout(deb); searchQuery=searchEl.value.trim();
    deb=setTimeout(renderConvList,200);
  });

  // Composer
  var msgInput=$('msgInput'), sendBtn=$('sendBtn');
  if(msgInput){
    msgInput.addEventListener('input',function(){
      sendBtn.disabled = !msgInput.value.trim();
      // Auto-resize
      msgInput.style.height='42px';
      msgInput.style.height=Math.min(msgInput.scrollHeight,120)+'px';
      $('composerError').classList.add('hidden');
    });
    msgInput.addEventListener('keydown',function(e){
      if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(!sendBtn.disabled) sendMessage(); }
    });
  }
  if(sendBtn) sendBtn.addEventListener('click', sendMessage);

  // Open specific conversation from URL param ?conv=c1
  var urlParams=new URLSearchParams(window.location.search);
  var convParam=urlParams.get('conv');
  if(convParam) setTimeout(function(){ openConv(convParam); },100);
  // Auto-open first conversation on desktop
  else if(window.innerWidth>700){
    setTimeout(function(){
      var convs=getConvs();
      if(convs.length) openConv(convs[0].id);
    }, 500);
  }
});
</script>
