<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports | MentorBridge Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css?v=3" />
  <!-- <script src="/js/admin-auth.js"></script> -->
  <script>(function(){AdminAuth.guardAdminPage();})();</script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-service.js"></script>
  <script src="/js/firebase-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="adm-body">
  <div id="adm-app"></div>
  <script src="/js/admin-data.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script src="/js/admin-page.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async function () {
    AdminPage.mountListPage({
      activeNav: 'reports',
      title: 'Reports & Analytics',
      subtitle: 'Platform growth and usage reports',
      contentHtml: '<div class="adm-card"><div class="adm-card-head"><h2>User Growth</h2></div><div class="adm-card-body"><div class="adm-chart-wrap" style="height:320px"><canvas id="reportChart"></canvas></div><p id="reportSource" style="font-size:0.72rem;color:#6B7280;margin-top:0.75rem"></p></div></div>',
      load: async function () {
        var data = await AdminData.fetchGrowthData(12);
        document.getElementById('reportSource').textContent = 'Data source: ' + data.source;
        new Chart(document.getElementById('reportChart'), {
          type: 'line',
          data: {
            labels: data.labels,
            datasets: [
              { label: 'Mentees', data: data.mentees, borderColor: '#1B62DE', tension: 0.35 },
              { label: 'Mentors', data: data.mentors, borderColor: '#4C7BE8', tension: 0.35 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    });
  });
  </script>
</body>
</html>
