<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentor Applications | MentorBridge Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css?v=3" />
  <script src="/js/admin-auth.js"></script>
  <script>(function(){AdminAuth.guardAdminPage();})();</script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-service.js"></script>
  <script src="/js/firebase-auth.js"></script>
</head>
<body class="adm-body">
  <div id="adm-app"></div>
  <script src="/js/admin-data.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script src="/js/admin-page.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async function () {
    AdminPage.mountListPage({
      activeNav: 'applications',
      title: 'Mentor Applications',
      subtitle: 'Review and approve mentor applications',
      contentHtml: '<div class="adm-card"><div class="adm-card-body" id="admPageBody"><p class="adm-kpi-loading">Loading…</p></div></div>',
      load: async function (el) {
        var pending = await AdminData.fetchPendingMentors();
        if (!pending.length) {
          el.innerHTML = '<div class="adm-empty">No pending applications<small>New mentor sign-ups awaiting approval will appear here.</small></div>';
          return;
        }
        el.innerHTML = pending.map(function (m) {
          return '<div class="adm-list-item" data-uid="' + m.uid + '">' +
            '<div class="adm-item-main"><strong>' + AdminPage.esc(m.name || m.email) + '</strong>' +
            '<span>' + AdminPage.esc(m.title || 'Mentor') + ' · Applied ' + AdminData.formatDate(m.createdAt) + '</span></div>' +
            '<div class="adm-actions">' +
            '<button type="button" class="adm-btn adm-btn-primary adm-approve" data-uid="' + m.uid + '">Approve</button>' +
            '<a class="adm-btn adm-btn-outline" href="/admin/mentor-detail?id=' + encodeURIComponent(m.uid) + '">Review</a>' +
            '</div></div>';
        }).join('');
        el.querySelectorAll('.adm-approve').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            btn.disabled = true;
            try {
              await AdminData.approveMentor(btn.dataset.uid);
              btn.closest('.adm-list-item').remove();
            } catch (e) { alert(e.message); btn.disabled = false; }
          });
        });
      }
    });
  });
  </script>
</body>
</html>
