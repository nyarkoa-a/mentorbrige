<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Setup | MentorBridge</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css?v=3" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body.adm-body {
      background: var(--adm-deep);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .setup-card {
      width: 100%;
      max-width: 480px;
      background: var(--adm-navy);
      border: 1px solid rgba(76,123,232,0.35);
      border-radius: var(--adm-radius);
      padding: 2rem;
      color: #fff;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    .setup-card h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.4rem;
      margin: 0 0 0.5rem;
    }
    .setup-card p { color: rgba(255,255,255,0.6); font-size: 0.85rem; line-height: 1.5; }
    .setup-creds {
      background: rgba(7,21,39,0.6);
      border: 1px solid rgba(76,123,232,0.25);
      border-radius: 10px;
      padding: 1rem;
      margin: 1.25rem 0;
      font-size: 0.82rem;
      line-height: 1.7;
    }
    .setup-creds strong { color: var(--adm-blue-light); }
    .setup-result {
      margin-top: 1rem;
      padding: 0.85rem;
      border-radius: 10px;
      font-size: 0.82rem;
      line-height: 1.5;
      display: none;
    }
    .setup-result.show { display: block; }
    .setup-result.ok { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .setup-result.err { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .setup-actions { display: flex; flex-direction: column; gap: 0.65rem; margin-top: 1.25rem; }
    .setup-link { text-align: center; margin-top: 1rem; font-size: 0.78rem; }
    .setup-link a { color: var(--adm-blue-light); }
  </style>
</head>
<body class="adm-body">
  <div class="setup-card">
    <h1>Admin Account Setup</h1>
    <p>Create the default MentorBridge admin account in Firebase. Run this once before your first admin login.</p>

    <div class="setup-creds">
      <strong>Email:</strong> admin@mentorbridge.com<br />
      <strong>Password:</strong> 1234admin<br />
      <strong>Access Key:</strong> mb-admin-2026
    </div>

    <div class="setup-actions">
      <button type="button" class="adm-submit" id="createBtn">Create Admin Account</button>
      <button type="button" class="adm-btn adm-btn-outline" id="resetBtn" style="justify-content:center;padding:0.65rem">Send Password Reset Email</button>
    </div>

    <div class="setup-result" id="result"></div>

    <p class="setup-link"><a href="/admin/login">← Back to Admin Login</a></p>
  </div>

  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-service.js"></script>
  <script src="/js/firebase-auth.js"></script>
  <script>
  (function () {
    var ADMIN = {
      email: 'admin@mentorbridge.com',
      password: '1234admin',
      name: 'MentorBridge Admin'
    };

    function show(msg, ok) {
      var el = document.getElementById('result');
      el.textContent = msg;
      el.className = 'setup-result show ' + (ok ? 'ok' : 'err');
    }

    async function ensureFirebase() {
      if (!window.mentorBridgeAuth.initialized) {
        await window.mentorBridgeAuth.initialize();
      }
    }

    document.getElementById('createBtn').addEventListener('click', async function () {
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'Creating…';
      try {
        await ensureFirebase();
        var result = await window.mentorBridgeAuth.registerUser({
          email: ADMIN.email,
          password: ADMIN.password,
          profile: { name: ADMIN.name, role: 'admin' }
        });
        show('Admin account created! User ID: ' + result.user.uid + '. You can now log in.', true);
        setTimeout(function () { window.location.href = '/admin/login'; }, 2500);
      } catch (e) {
        var msg = e.message || String(e);
        if (msg.includes('already in use') || msg.includes('email-already-in-use')) {
          show('Account already exists for admin@mentorbridge.com. If login fails, click "Send Password Reset Email" below, or verify you are using password: 1234admin', true);
        } else {
          show('Failed: ' + msg, false);
        }
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Admin Account';
      }
    });

    document.getElementById('resetBtn').addEventListener('click', async function () {
      var btn = this;
      btn.disabled = true;
      try {
        await ensureFirebase();
        await window.mentorBridgeAuth.sendPasswordResetEmail(ADMIN.email);
        show('Password reset email sent to ' + ADMIN.email + '. Check your inbox, set a new password, then log in.', true);
      } catch (e) {
        show('Reset failed: ' + (e.message || e), false);
      } finally {
        btn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
