<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentors | MentorBridge Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css?v=3" />
  <script src="/js/admin-auth.js"></script>
  <script>(function(){AdminAuth.guardAdminPage();})();</script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-service.js"></script>
  <script src="/js/firebase-auth.js"></script>
</head>
<body class="adm-body">
  <div id="adm-app"></div>
  <script src="/js/admin-data.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script src="/js/admin-page.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async function () {
    AdminPage.mountListPage({
      activeNav: 'mentors',
      title: 'Mentors',
      subtitle: 'Approved and active mentors',
      contentHtml: '<div class="adm-card"><div class="adm-card-body adm-table-wrap" id="admPageBody"><p class="adm-kpi-loading">Loading…</p></div></div>',
      load: async function (el) {
        var all = await AdminData.fetchAllUsers();
        var mentors = all.users.filter(function (u) {
          return u.role === 'mentor' && u.accountStatus !== 'pending' && u.mentorApprovalStatus !== 'pending';
        });
        el.innerHTML = AdminPage.usersTable(mentors, [
          { label: 'Name', render: function (u) { return AdminPage.esc(u.name || '—'); } },
          { label: 'Email', key: 'email' },
          { label: 'Title', render: function (u) { return AdminPage.esc(u.title || u.industry || '—'); } },
          { label: 'Joined', render: function (u) { return AdminData.formatDate(u.createdAt); } },
          { label: '', render: function (u) {
            return '<a class="adm-btn adm-btn-outline" href="/admin/mentor-detail?id=' + encodeURIComponent(u.uid || u.id) + '">View</a>';
          }}
        ]);
      }
    });
  });
  </script>
</body>
</html>
