<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Services Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .status { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .warn { background: #fff3cd; color: #856404; }
        .info { background: #cce7ff; color: #004085; }
        pre { background: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🔍 Auth Services Debug Tool</h1>
    
    <div id="status"></div>
    
    <button onclick="runDiagnostics()">🔄 Run Diagnostics</button>
    <button onclick="testLogin()">🧪 Test Login</button>
    <button onclick="clearLogs()">🗑️ Clear</button>
    
    <h3>Console Output:</h3>
    <pre id="console-output"></pre>

    <!-- Load all the Firebase scripts -->
    <script src="public/js/firebase-script-loader.js"></script>
    <script src="public/js/firebase-manager.js"></script>
    <script src="public/js/firebase-config.js"></script>
    <script src="public/js/firebase-service.js"></script>
    <script src="public/js/firebase-auth.js"></script>
    <script src="public/js/auth-ui-integration.js"></script>

    <script>
        let logOutput = [];
        
        // Capture console logs
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        console.log = (...args) => {
            logOutput.push(`LOG: ${args.join(' ')}`);
            originalLog(...args);
            updateConsoleOutput();
        };
        
        console.warn = (...args) => {
            logOutput.push(`WARN: ${args.join(' ')}`);
            originalWarn(...args);
            updateConsoleOutput();
        };
        
        console.error = (...args) => {
            logOutput.push(`ERROR: ${args.join(' ')}`);
            originalError(...args);
            updateConsoleOutput();
        };
        
        function updateConsoleOutput() {
            document.getElementById('console-output').textContent = logOutput.slice(-20).join('\n');
        }
        
        function addStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('status').appendChild(div);
            
            // Keep only last 10 status messages
            const statusEl = document.getElementById('status');
            while (statusEl.children.length > 10) {
                statusEl.removeChild(statusEl.firstChild);
            }
        }
        
        async function runDiagnostics() {
            addStatus('🔍 Starting diagnostics...', 'info');
            
            // Check if services exist
            const services = {
                firebaseManager: window.firebaseManager,
                mentorBridgeAuth: window.mentorBridgeAuth,
                authUIIntegration: window.authUIIntegration,
                authOperations: window.authOperations,
                firebaseService: window.firebaseService
            };
            
            for (const [name, service] of Object.entries(services)) {
                if (service) {
                    if (service.initialized !== undefined) {
                        addStatus(`✅ ${name}: loaded, initialized=${service.initialized}`, service.initialized ? 'pass' : 'warn');
                    } else {
                        addStatus(`✅ ${name}: loaded (no init status)`, 'pass');
                    }
                } else {
                    addStatus(`❌ ${name}: NOT FOUND`, 'fail');
                }
            }
            
            // Try to initialize Firebase Manager if it exists
            if (window.firebaseManager) {
                try {
                    addStatus('🔥 Initializing Firebase Manager...', 'info');
                    await window.firebaseManager.initialize({
                        services: ['app', 'auth', 'firestore', 'storage'],
                        initializeUI: true
                    });
                    
                    if (window.firebaseManager.isReady()) {
                        addStatus('✅ Firebase Manager initialized successfully', 'pass');
                        
                        // Check status
                        const status = window.firebaseManager.getStatus();
                        addStatus(`📊 Firebase Manager status: ${JSON.stringify(status.initializationState)}`, 'info');
                    } else {
                        addStatus('⚠️ Firebase Manager not ready after initialization', 'warn');
                    }
                } catch (error) {
                    addStatus(`❌ Firebase Manager initialization failed: ${error.message}`, 'fail');
                }
            }
            
            // Wait a bit for other services to initialize
            addStatus('⏳ Waiting for other services...', 'info');
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            // Check service states again
            if (window.mentorBridgeAuth) {
                addStatus(`🔐 MentorBridge Auth initialized: ${window.mentorBridgeAuth.initialized}`, 
                         window.mentorBridgeAuth.initialized ? 'pass' : 'warn');
            }
            
            if (window.authUIIntegration) {
                addStatus(`🔗 Auth UI Integration initialized: ${window.authUIIntegration.initialized}`, 
                         window.authUIIntegration.initialized ? 'pass' : 'warn');
            }
            
            if (window.authOperations) {
                addStatus(`🔧 Auth Operations available: ${typeof window.authOperations.login === 'function'}`, 
                         typeof window.authOperations.login === 'function' ? 'pass' : 'warn');
            }
            
            addStatus('🏁 Diagnostics complete', 'info');
        }
        
        async function testLogin() {
            addStatus('🧪 Testing login...', 'info');
            
            const email = 'test@example.com';
            const password = 'password123';
            
            try {
                if (!window.authOperations) {
                    throw new Error('Auth Operations not available');
                }
                
                if (typeof window.authOperations.login !== 'function') {
                    throw new Error('Login function not available');
                }
                
                addStatus('📞 Calling authOperations.login...', 'info');
                const result = await window.authOperations.login(email, password, 'student');
                addStatus(`✅ Login call completed: ${JSON.stringify(result)}`, 'pass');
                
            } catch (error) {
                addStatus(`❌ Login test failed: ${error.message}`, 'fail');
                
                // Try fallback methods
                if (window.mentorBridgeAuth && window.mentorBridgeAuth.initialized) {
                    try {
                        addStatus('🔄 Trying direct MentorBridge Auth...', 'info');
                        const result = await window.mentorBridgeAuth.signInUser(email, password);
                        addStatus(`✅ Direct auth call: ${JSON.stringify(result)}`, 'pass');
                    } catch (directError) {
                        addStatus(`❌ Direct auth failed: ${directError.message}`, 'fail');
                    }
                } else {
                    addStatus('❌ MentorBridge Auth not available for fallback', 'fail');
                }
            }
        }
        
        function clearLogs() {
            document.getElementById('status').innerHTML = '';
            logOutput = [];
            updateConsoleOutput();
        }
        
        // Auto-run diagnostics after page load
        window.addEventListener('load', () => {
            setTimeout(runDiagnostics, 500);
        });
    </script>
</body>
</html>
