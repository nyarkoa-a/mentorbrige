<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth Debug | MentorBridge</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .debug-container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .status { padding: 10px; border-radius: 4px; margin: 10px 0; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .debug-section h3 { margin-top: 0; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
        button { padding: 8px 16px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: black; }
        input[type="email"], input[type="password"] { width: 200px; padding: 5px; margin: 5px; }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>🔍 Firebase Authentication Debug Tool</h1>
        <p>This tool will help us diagnose authentication issues across different browsers.</p>
        
        <div id="browserInfo" class="debug-section">
            <h3>Browser Information</h3>
            <div id="browserDetails"></div>
        </div>
        
        <div id="firebaseStatus" class="debug-section">
            <h3>Firebase SDK Status</h3>
            <div id="sdkStatus"></div>
        </div>
        
        <div id="configStatus" class="debug-section">
            <h3>Firebase Configuration</h3>
            <div id="configDetails"></div>
        </div>
        
        <div id="authStatus" class="debug-section">
            <h3>Authentication Status</h3>
            <div id="authDetails"></div>
        </div>
        
        <div id="testControls" class="debug-section">
            <h3>Test Authentication</h3>
            <div>
                <input type="email" id="testEmail" placeholder="test@example.com" value="test@mentorbridge.com">
                <input type="password" id="testPassword" placeholder="password" value="test123">
                <br>
                <button class="btn-primary" onclick="testRegister()">Test Register</button>
                <button class="btn-success" onclick="testLogin()">Test Login</button>
                <button class="btn-danger" onclick="testLogout()">Test Logout</button>
                <button class="btn-warning" onclick="runConnectivityTest()">Test Connectivity</button>
            </div>
            <div id="testResults"></div>
        </div>
        
        <div id="debugLog" class="debug-section">
            <h3>Debug Log</h3>
            <div id="logOutput" style="max-height: 300px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 4px;">
                <div class="info">Debug log will appear here...</div>
            </div>
            <button class="btn-warning" onclick="clearLog()">Clear Log</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    
    <!-- MentorBridge Firebase modules -->
    <script src="public/js/firebase-config.js"></script>
    <script src="public/js/firebase-service.js"></script>
    <script src="public/js/firebase-auth.js"></script>

    <script>
        // Debug logging
        function debugLog(message, type = 'info') {
            const logOutput = document.getElementById('logOutput');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = type;
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logOutput.appendChild(logEntry);
            logOutput.scrollTop = logOutput.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }

        function clearLog() {
            document.getElementById('logOutput').innerHTML = '';
        }

        // Browser detection
        function detectBrowser() {
            const userAgent = navigator.userAgent;
            let browser = 'Unknown';
            
            if (userAgent.includes('Chrome') && !userAgent.includes('Edg')) browser = 'Chrome';
            else if (userAgent.includes('Safari') && !userAgent.includes('Chrome')) browser = 'Safari';
            else if (userAgent.includes('Firefox')) browser = 'Firefox';
            else if (userAgent.includes('Edg')) browser = 'Edge';
            
            return {
                name: browser,
                userAgent: userAgent,
                cookiesEnabled: navigator.cookieEnabled,
                localStorage: typeof(Storage) !== "undefined",
                sessionStorage: typeof(sessionStorage) !== "undefined",
                indexedDB: typeof(indexedDB) !== "undefined"
            };
        }

        // Update browser info
        function updateBrowserInfo() {
            const browser = detectBrowser();
            document.getElementById('browserDetails').innerHTML = `
                <div class="info">
                    <strong>Browser:</strong> ${browser.name}<br>
                    <strong>Cookies:</strong> ${browser.cookiesEnabled ? '✅ Enabled' : '❌ Disabled'}<br>
                    <strong>LocalStorage:</strong> ${browser.localStorage ? '✅ Available' : '❌ Not Available'}<br>
                    <strong>SessionStorage:</strong> ${browser.sessionStorage ? '✅ Available' : '❌ Not Available'}<br>
                    <strong>IndexedDB:</strong> ${browser.indexedDB ? '✅ Available' : '❌ Not Available'}
                </div>
            `;
        }

        // Check Firebase SDK
        function checkFirebaseSDK() {
            const sdkStatus = document.getElementById('sdkStatus');
            let status = '<div class="success">Firebase SDK Status:</div>';
            
            if (typeof firebase !== 'undefined') {
                status += '<div class="success">✅ Firebase SDK loaded</div>';
                
                if (firebase.auth) {
                    status += '<div class="success">✅ Firebase Auth available</div>';
                } else {
                    status += '<div class="error">❌ Firebase Auth not available</div>';
                }
                
                if (firebase.firestore) {
                    status += '<div class="success">✅ Firebase Firestore available</div>';
                } else {
                    status += '<div class="error">❌ Firebase Firestore not available</div>';
                }
            } else {
                status += '<div class="error">❌ Firebase SDK not loaded</div>';
            }
            
            sdkStatus.innerHTML = status;
        }

        // Initialize and test Firebase
        async function initializeAndTest() {
            try {
                debugLog('Starting Firebase initialization...', 'info');
                
                // Check if Firebase config functions exist
                if (typeof initializeFirebaseConfig === 'undefined') {
                    throw new Error('initializeFirebaseConfig function not found');
                }
                
                debugLog('Calling initializeFirebaseConfig...', 'info');
                const config = await initializeFirebaseConfig();
                debugLog(`Firebase config loaded: ${JSON.stringify(config)}`, 'success');
                
                // Update config display
                document.getElementById('configDetails').innerHTML = `
                    <div class="success">
                        <strong>Project ID:</strong> ${config.projectId}<br>
                        <strong>Auth Domain:</strong> ${config.authDomain}<br>
                        <strong>API Key:</strong> ${config.apiKey ? '✅ Present' : '❌ Missing'}
                    </div>
                `;
                
                // Initialize MentorBridge Auth
                if (window.mentorBridgeAuth) {
                    debugLog('Initializing MentorBridge Auth...', 'info');
                    await window.mentorBridgeAuth.initialize();
                    debugLog('MentorBridge Auth initialized successfully', 'success');
                    
                    // Set up auth state listener
                    window.mentorBridgeAuth.onAuthStateChanged((authEvent) => {
                        updateAuthStatus(authEvent);
                    });
                    
                    // Initial auth status
                    updateAuthStatus({
                        user: window.mentorBridgeAuth.getCurrentUser(),
                        profile: window.mentorBridgeAuth.getUserProfile()
                    });
                } else {
                    throw new Error('MentorBridge Auth not available');
                }
                
            } catch (error) {
                debugLog(`Firebase initialization failed: ${error.message}`, 'error');
                document.getElementById('configDetails').innerHTML = `<div class="error">❌ ${error.message}</div>`;
                document.getElementById('authDetails').innerHTML = `<div class="error">❌ Authentication not available</div>`;
            }
        }

        // Update auth status display
        function updateAuthStatus(authEvent) {
            const authDetails = document.getElementById('authDetails');
            const user = authEvent.user;
            const profile = authEvent.profile;
            
            if (user && profile) {
                authDetails.innerHTML = `
                    <div class="success">
                        <strong>Status:</strong> ✅ Authenticated<br>
                        <strong>Email:</strong> ${user.email}<br>
                        <strong>Name:</strong> ${profile.name}<br>
                        <strong>Role:</strong> ${profile.role}<br>
                        <strong>Email Verified:</strong> ${user.emailVerified ? '✅ Yes' : '❌ No'}
                    </div>
                `;
            } else if (user && !profile) {
                authDetails.innerHTML = `
                    <div class="warning">
                        <strong>Status:</strong> ⚠️ User exists but profile loading<br>
                        <strong>Email:</strong> ${user.email}
                    </div>
                `;
            } else {
                authDetails.innerHTML = `
                    <div class="info">
                        <strong>Status:</strong> 🚫 Not authenticated
                    </div>
                `;
            }
        }

        // Test functions
        async function testRegister() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            if (!email || !password) {
                debugLog('Please enter email and password', 'error');
                return;
            }
            
            try {
                debugLog(`Attempting to register ${email}...`, 'info');
                
                const result = await window.mentorBridgeAuth.registerUser({
                    email: email,
                    password: password,
                    profile: {
                        name: 'Test User',
                        role: 'student'
                    }
                });
                
                debugLog(`Registration result: ${JSON.stringify(result)}`, 'success');
                document.getElementById('testResults').innerHTML = `<div class="success">✅ Registration successful</div>`;
                
            } catch (error) {
                debugLog(`Registration failed: ${error.message}`, 'error');
                document.getElementById('testResults').innerHTML = `<div class="error">❌ Registration failed: ${error.message}</div>`;
            }
        }

        async function testLogin() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            if (!email || !password) {
                debugLog('Please enter email and password', 'error');
                return;
            }
            
            try {
                debugLog(`Attempting to login ${email}...`, 'info');
                
                const result = await window.mentorBridgeAuth.signInUser(email, password);
                debugLog(`Login result: ${JSON.stringify(result)}`, 'success');
                
                if (result.success) {
                    document.getElementById('testResults').innerHTML = `<div class="success">✅ Login successful</div>`;
                } else {
                    document.getElementById('testResults').innerHTML = `<div class="warning">⚠️ Login issue: ${result.message}</div>`;
                }
                
            } catch (error) {
                debugLog(`Login failed: ${error.message}`, 'error');
                document.getElementById('testResults').innerHTML = `<div class="error">❌ Login failed: ${error.message}</div>`;
            }
        }

        async function testLogout() {
            try {
                debugLog('Attempting to logout...', 'info');
                await window.mentorBridgeAuth.signOut();
                debugLog('Logout successful', 'success');
                document.getElementById('testResults').innerHTML = `<div class="success">✅ Logout successful</div>`;
                
            } catch (error) {
                debugLog(`Logout failed: ${error.message}`, 'error');
                document.getElementById('testResults').innerHTML = `<div class="error">❌ Logout failed: ${error.message}</div>`;
            }
        }

        async function runConnectivityTest() {
            try {
                debugLog('Running Firebase connectivity test...', 'info');
                const result = await testFirebaseConnectivity();
                debugLog(`Connectivity test result: ${JSON.stringify(result)}`, result.success ? 'success' : 'error');
                
                const status = result.success ? 'success' : 'error';
                const message = result.success ? '✅ Connectivity test passed' : `❌ Connectivity test failed: ${result.error}`;
                document.getElementById('testResults').innerHTML = `<div class="${status}">${message}</div>`;
                
            } catch (error) {
                debugLog(`Connectivity test error: ${error.message}`, 'error');
                document.getElementById('testResults').innerHTML = `<div class="error">❌ Connectivity test error: ${error.message}</div>`;
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('Debug page loaded', 'info');
            updateBrowserInfo();
            checkFirebaseSDK();
            initializeAndTest();
        });

        // Global error handler
        window.addEventListener('error', function(event) {
            debugLog(`JavaScript Error: ${event.error.message}`, 'error');
        });

        // Unhandled promise rejection handler
        window.addEventListener('unhandledrejection', function(event) {
            debugLog(`Unhandled Promise Rejection: ${event.reason}`, 'error');
        });
    </script>
</body>
</html>
